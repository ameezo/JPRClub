services:
  postgres:
    image: postgres:16-alpine
    container_name: jprclub-db-prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jprclub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-jprclub}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jprclub}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend.Dockerfile
    container_name: jprclub-backend-prod
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-jprclub}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-jprclub}
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    volumes:
      - media_data:/app/media

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend.prod.Dockerfile
    container_name: jprclub-frontend-prod
    restart: always
    ports:
      - "${PORT:-80}:80"
    depends_on:
      - backend
    environment:
      VITE_API_URL: /api
  # cloudflared:
  #   image: cloudflare/cloudflared:latest
  #   container_name: jprclub-tunnel
  #   restart: always
  #   command: tunnel --no-autoupdate run
  #   environment:
  #     - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
  #   depends_on:
  #     - frontend
  #     - backend

volumes:
  postgres_data:
  media_data:
